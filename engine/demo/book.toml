# Демо-книга движка html-textbook-engine: показывает значения по умолчанию для новых книг
# и возможности, которые в go-textbook выключены. Сборка:
#   python -m engine.build --all --book engine/demo/book.toml --dist /tmp/demo-dist

# Оверлеи навигации (траектории): ключ верхнего уровня, поэтому до первой секции
overlays = [
  { title = "Быстрый старт", modules = [1] },
]

[project]
version = "0.1.0"
storage_prefix = "demo_"

[content]
root = "sources"
title_source = "h1"
index_file = '^0+\. '

[callouts]
alias = { critical = "danger" }

[markdown]
obsidian_lists = true
indented_fences = true

[math]
protect = ['\(', '\[', "$$"]

[branding]
logo_title_text = "DEMO"
logo_sub = "html-textbook-engine"
logo_aria_label = "На главную демо-книги"

[article_page]
title_suffix_html = " | Демо-книга"
meta_description_html = "{title} — демо-книга движка html-textbook-engine."
footer_html = ["Демо-книга движка html-textbook-engine"]

[index_page]
title_html = "Демо-книга html-textbook-engine"
meta_description_html = "Демонстрация возможностей движка."
hero_badge_html = "html-textbook-engine"
hero_title_html = "Демо-книга: {modules} модуля, {articles} страниц"
quote_html = "<em>«Сначала сделайте так, чтобы работало».</em>"
quote_author_html = "— Брайан Керниган"
search_placeholder = "Поиск по {articles_grouped} страницам..."
stats = [
  { value = "{modules}", label = "модуля" },
  { value = "{articles}", label = "страниц" },
]
catalog_title_html = "Модули"
catalog_sub_html = "Каждый модуль показывает свою часть движка"
footer_html = ["Демо-книга движка html-textbook-engine"]

[strings.article]
position = "Страница {n} из {m}"
