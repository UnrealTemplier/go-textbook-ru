<header class="index-hero">
      <div class="hero-top-meta">
        <span class="hero-badge">${hero_badge}</span>
        <span class="hero-version">v${version}</span>
      </div>
      <h1 class="hero-title">${hero_title}</h1>
      <blockquote class="hero-quote">
        <p>${quote}</p>
        <cite class="quote-author">${quote_author}</cite>
      </blockquote>

      <!-- Полнотекстовый живой поиск -->
      <div class="hero-search-box" role="search">
        <div class="search-bar-inner">
          <label for="global-search-input" class="visually-hidden">${search_label}</label>
          <svg class="hero-search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="global-search-input" placeholder="${search_placeholder}" autocomplete="off" aria-label="${search_aria}">
        </div>
        <div class="search-results-dropdown" id="global-search-results" role="listbox" aria-label="${search_results_aria}"></div>
      </div>

      <!-- Виджеты статистики -->
      <div class="stats-ribbon" role="region" aria-label="${stats_aria}">
${stats}
      </div>
    </header>
