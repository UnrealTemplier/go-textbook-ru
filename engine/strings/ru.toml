# engine/strings/ru.toml — строки интерфейса движка (русский).
# Книга переопределяет отдельные ключи в book.toml, секция [strings] с той же структурой;
# ключ, которого здесь нет, — ошибка. {n}, {name} — подстановки. Строки вставляются в HTML
# без экранирования. Строки, которые вставляет main.js, пока живут в main.js (до этапа А3ж).

