  { badge = "Шаг 3", title_html = "Хранилища и Распределенные системы (Модули 10–14)", text_html = "B+ Tree vs LSM, MVCC, транзакции, Kafka, NATS, консенсус Raft/Paxos, CAP/PACELC и микросервисы." },
