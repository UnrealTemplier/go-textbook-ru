quote_author_html = "— Брайан Керниган"
search_placeholder = "Поиск по {articles_grouped} лекциям (например: netpoller, GC, MVCC, Raft, CAS)..."
stats = [
  { value = "{modules}", label = "Тематических модуля" },
  { value = "{articles}", label = "Инженерных лекций" },
  { value = "{mermaid}", label = "Диаграмм Mermaid" },
