  "Полностью автономная сборка. Никаких трекеров, рекламы и внешних серверов.",
]

# Расширения Python-Markdown движка: выключены, пока их не включит свой коммит этапа А3
# (А3л — списки, А3з — ограды с отступом, А3и — защита \( и \[).
[markdown]
obsidian_lists = false
indented_fences = false

# KaTeX: ровно текущие значения main.js (test_book_rules сверяет их)
[math]
delimiters = [
  { left = "$$", right = "$$", display = true },
  { left = "$", right = "$", display = false },
  { left = '\(', right = '\)', display = false },
  { left = '\[', right = '\]', display = true },
]
# А3и (U12, U19): защищаются только \( и \[; защита $ и $$ — после А5 (59 страниц, суммы в долларах)
protect = ['\(', '\[']
ignored_tags = ["script", "noscript", "style", "textarea", "pre", "code", "option"]
ignored_classes = ["code-block", "mermaid", "mermaid-wrapper"]
