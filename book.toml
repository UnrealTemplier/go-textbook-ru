# book.toml — конфигурация книги go-textbook для движка (engine/config.py).
# Значения воспроизводят текущий вывод сайта побайтно. Описание ключей —
# engine-extraction/html-engine-extracting-analysis-final.md, § 4.4.

[project]
# Версия читается из AGENTS.md § 1.4: ровно одна строка, SemVer (иначе [VERSION ERROR])
version_file = "AGENTS.md"
version_pattern = '''^\s*[-*]?\s*\*\*Current project version:\*\*\s*`?([0-9A-Za-z.-]+)`?'''
# Префикс ключей localStorage: книги на одном origin GitHub Pages делят хранилище
storage_prefix = "go_encyclopedia_"

[content]
root = "sources"
# Канонические названия из имён файлов (суррогаты Obsidian → типографика). Порядок важен:
# net_http_httptest раньше net_http.
canonical_replacements = [
  ["CI_CD", "CI/CD"],
  ["TCP_IP", "TCP/IP"],
  ["I_O", "I/O"],
  ["net_http_httptest", "net/http/httptest"],
  ["net_http_pprof", "net/http/pprof"],
  ["net_http", "net/http"],
  ["io_ioutil", "io/ioutil"],
  ["unicode_utf8", "unicode/utf8"],
  ["path_filepath", "path/filepath"],
  ["io_fs", "io/fs"],
  ["log_slog", "log/slog"],
  ["sync_atomic", "sync/atomic"],
  ["sync_pool", "sync.Pool"],
  ["sync_map", "sync.Map"],
  ["container_list", "container/list"],
  ["container_heap", "container/heap"],
  ["container_ring", "container/ring"],
  ["encoding_json", "encoding/json"],
  ["encoding_xml", "encoding/xml"],
  ["encoding_csv", "encoding/csv"],
  ["encoding_gob", "encoding/gob"],
  ["net_url", "net/url"],
  ["crypto_rand", "crypto/rand"],
  ["math_rand", "math/rand"],
  ["database_sql", "database/sql"],
  ["archive_zip", "archive/zip"],
  ["compress_gzip", "compress/gzip"],
  ["os_exec", "os/exec"],
  ["golang_org_x_sys", "golang.org/x/sys"],
  ["testing_quick", "testing/quick"],
]
# Шаблонные фразы, которые сборка вырезает из HTML (тексты в sources/ не меняются).
# Для go-textbook навсегда: отключение изменит видимый текст статей.
clean_cliches = [
  '''В современном (?:мире|быстро меняющемся мире)[^,.]*,\s*''',
  '''Важно (?:понимать|помнить|отметить), что\s+''',
  '''Как известно,\s+''',
  '''Не секрет, что\s+''',
  '''Давайте (?:рассмотрим|разберем|погрузимся в)[^.\n]*:\s*''',
]

[slug]
module = 35
section = 35
subsection = [20, 25]
page = 55
anchor = 80

[callouts]
interview_heuristic = true

[navigation.reading_time]
method = "bytes"
divisor = 800
min = 2
